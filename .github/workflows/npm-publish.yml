name: NPM Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version '22' meets the required Node version (>= 22.14.0) but
      # ships npm 10.x, which is too old for trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing over OIDC requires npm >= 11.5.1. Without this step
      # the publish fails even when the trusted publisher is configured
      # correctly on npmjs. Pinned to 11.x rather than @latest so that a future
      # npm major cannot break a release unannounced.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # No --if-present: if the build script were ever renamed or removed the
      # job must fail rather than silently publish a stale dist/.
      - name: Build
        run: npm run build

      # A release tag pointing at a commit with a different version would
      # otherwise be published under the wrong number, unnoticed.
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag and package version agree: $PKG"

      # Tests the actual artifact rather than the source: packs the tarball,
      # installs it with ONLY its declared dependencies, and requires it. This
      # catches undeclared runtime dependencies, which stay invisible in the dev
      # node_modules (see #32 / 1.1.6, missing int64-buffer).
      - name: Smoke test the packed tarball
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -1)"
          echo "Packed: $TARBALL"
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP/$TARBALL"
          node -e "
            const m = require('adabas-tcp');
            for (const name of ['Adabas', 'AdabasMap', 'CallType']) {
              if (!m[name]) { console.error('Missing export: ' + name); process.exit(1); }
            }
            console.log('Smoke test OK:', Object.keys(m).join(', '));
          "

      - name: Publish to npm
        run: npm publish --provenance --access public
